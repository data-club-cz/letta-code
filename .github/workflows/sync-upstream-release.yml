name: Sync upstream release tags

# Merges new release-tagged commits from letta-ai/letta-code into our
# data-club-patch branch. Only release tags (vX.Y.Z) are merged — feature
# work on upstream's main is intentionally skipped until tagged.
#
# Strategy: walk every upstream tag matching v*.*.* that we haven't merged,
# in chronological order; merge each via a fast-forward-or-merge into our
# branch. Conflicts open a PR for human review instead of overwriting.

on:
  schedule:
    # Every 6 hours. Upstream releases roughly weekly; the cron is a
    # cheap heartbeat — no notifications until something actually merges.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Specific upstream tag to merge (default: all unmerged release tags)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout data-club-patch
        uses: actions/checkout@v4
        with:
          ref: data-club-patch
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "data-club-sync-bot"
          git config user.email "noreply@data-club.cz"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/letta-ai/letta-code.git
          git fetch upstream --tags --no-tags +refs/tags/v*:refs/tags/upstream-v*

      - name: Determine tags to merge
        id: tags
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            echo "tags=upstream-${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Collect upstream-v*.*.* tags in version order, then filter to:
          #   1. NOT already an ancestor of HEAD (i.e. not yet merged), AND
          #   2. strictly NEWER (by semver) than the highest tag that IS an
          #      ancestor of HEAD. Upstream history isn't strictly linear —
          #      older release tags can sit on branches that never merged
          #      into the line we forked from, and we don't want to merge
          #      ancient releases into a newer baseline.
          all=$(git for-each-ref --sort=v:refname --format='%(refname:short)' 'refs/tags/upstream-v*' \
                | grep -E '^upstream-v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          # Find the highest tag that's already in HEAD's history; treat that
          # as the baseline. Version-sorted listing means the last ancestor is
          # the highest.
          baseline=""
          for t in $all; do
            if git merge-base --is-ancestor "$t" HEAD 2>/dev/null; then
              baseline="$t"
            fi
          done
          echo "Baseline (highest tag in HEAD's history): ${baseline:-<none>}"
          unmerged=""
          for t in $all; do
            if git merge-base --is-ancestor "$t" HEAD 2>/dev/null; then
              continue
            fi
            # Strictly-newer-than-baseline check via `sort -V`. If no
            # baseline, every non-ancestor tag is fair game.
            if [ -n "$baseline" ]; then
              top=$(printf '%s\n%s\n' "$baseline" "$t" | sort -V | tail -1)
              [ "$top" = "$baseline" ] && continue
            fi
            unmerged="$unmerged $t"
          done
          unmerged_clean=$(echo "$unmerged" | xargs | tr ' ' ',')
          echo "tags=$unmerged_clean" >> "$GITHUB_OUTPUT"

      - name: Merge each unmerged tag
        id: merge
        if: steps.tags.outputs.tags != ''
        env:
          TAG_LIST: ${{ steps.tags.outputs.tags }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IFS=',' read -ra TAGS <<< "$TAG_LIST"
          merged=""
          for tag in "${TAGS[@]}"; do
            upstream_label="${tag#upstream-}"
            echo "::group::Merging $upstream_label"
            if git merge --no-ff -m "chore: sync upstream $upstream_label" "$tag"; then
              echo "Merged $upstream_label cleanly."
              merged="${merged:+$merged, }$upstream_label"
            else
              branch="sync/upstream-$upstream_label"
              # If a prior run already opened a conflict PR for this tag and it's
              # still open, the conflict is awaiting human resolution. Don't
              # re-notify or force-push every 6h — publish any clean merges from
              # this run and stop quietly.
              if gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -qx OPEN; then
                echo "Conflict PR for $upstream_label already open; awaiting resolution. Skipping."
                git merge --abort
                [ -n "$merged" ] && echo "merged_tags=$merged" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::warning::Conflict merging $upstream_label — opening a PR for review."
              # We're mid-merge with an unmerged index, and git refuses to switch
              # branches in that state ("you need to resolve your current index
              # first"). Abort to restore a clean data-club-patch, branch off,
              # then redo the merge so the conflict markers land on the PR
              # branch — never on data-club-patch itself.
              git merge --abort
              git checkout -B "$branch"
              # Redo the merge; it conflicts again. `|| true` stops set -e from
              # aborting the step on the expected non-zero exit. `commit -am`
              # skips unmerged paths, so stage everything with `add -A` first.
              git merge --no-ff -m "chore: sync upstream $upstream_label" "$tag" || true
              git add -A
              git commit --no-verify -m "chore: sync upstream $upstream_label (CONFLICTS — resolve before merge)"
              git push origin "$branch" --force
              pr_url=$(gh pr create \
                --base data-club-patch \
                --head "$branch" \
                --title "sync: upstream $upstream_label (conflicts)" \
                --body "Automated merge of upstream tag \`$upstream_label\` produced conflicts. Resolve and merge manually." \
                || gh pr view "$branch" --json url --jq .url \
                || echo "")
              echo "conflict_pr=$pr_url" >> "$GITHUB_OUTPUT"
              echo "conflict_tag=$upstream_label" >> "$GITHUB_OUTPUT"
              # Persist any clean merges that happened before the conflict so the
              # later push step publishes them to data-club-patch.
              [ -n "$merged" ] && echo "merged_tags=$merged" >> "$GITHUB_OUTPUT"
              # Return to data-club-patch (still holding only the clean merges, if
              # any) so "Push merged commits" never publishes conflict markers.
              git checkout -f data-club-patch
              # Stop on the first conflict — let a human resolve before continuing.
              exit 0
            fi
            echo "::endgroup::"
          done
          [ -n "$merged" ] && echo "merged_tags=$merged" >> "$GITHUB_OUTPUT"

      - name: Push merged commits
        if: steps.merge.outputs.merged_tags != ''
        run: git push origin data-club-patch

      - name: Notify Slack
        if: always() && (steps.tags.outputs.tags != '' || failure())
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          MERGED: ${{ steps.merge.outputs.merged_tags }}
          CONFLICT_PR: ${{ steps.merge.outputs.conflict_pr }}
          CONFLICT_TAG: ${{ steps.merge.outputs.conflict_tag }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "SLACK_WEBHOOK_URL not set, skipping notification."
            exit 0
          fi
          if [ -n "$CONFLICT_TAG" ]; then
            if [ -n "$CONFLICT_PR" ]; then
              msg=":warning: letta-code sync hit a conflict on \`$CONFLICT_TAG\` — review <$CONFLICT_PR|the PR>."
            else
              msg=":warning: letta-code sync hit a conflict on \`$CONFLICT_TAG\` — PR auto-open failed, see <$RUN_URL|run logs>."
            fi
            if [ -n "$MERGED" ]; then
              msg="$msg (Cleanly merged before the conflict: $MERGED.)"
            fi
          elif [ "$JOB_STATUS" = "failure" ] || [ "$JOB_STATUS" = "cancelled" ]; then
            msg=":x: letta-code sync workflow $JOB_STATUS — <$RUN_URL|logs>."
          elif [ -n "$MERGED" ]; then
            msg=":white_check_mark: letta-code synced upstream into \`data-club-patch\`: $MERGED."
          else
            exit 0
          fi
          curl -fsS -X POST -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg t "$msg" '{text:$t}')" "$WEBHOOK"
