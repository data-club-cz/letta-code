name: Sync upstream release tags

# Merges new release-tagged commits from letta-ai/letta-code into our
# data-club-patch branch. Only release tags (vX.Y.Z) are merged — feature
# work on upstream's main is intentionally skipped until tagged.
#
# Strategy: walk every upstream tag matching v*.*.* that we haven't merged,
# in chronological order; merge each via a fast-forward-or-merge into our
# branch. Conflicts open a PR for human review instead of overwriting.

on:
  schedule:
    # Every 6 hours. Upstream releases roughly weekly; the cron is a
    # cheap heartbeat — no notifications until something actually merges.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Specific upstream tag to merge (default: all unmerged release tags)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout data-club-patch
        uses: actions/checkout@v4
        with:
          ref: data-club-patch
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "data-club-sync-bot"
          git config user.email "noreply@data-club.cz"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/letta-ai/letta-code.git
          git fetch upstream --tags --no-tags +refs/tags/v*:refs/tags/upstream-v*

      - name: Determine tags to merge
        id: tags
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            echo "tags=upstream-${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Collect upstream-v*.*.* tags in version order, then keep only those
          # not yet reachable from HEAD.
          all=$(git for-each-ref --sort=v:refname --format='%(refname:short)' 'refs/tags/upstream-v*' \
                | grep -E '^upstream-v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          unmerged=""
          for t in $all; do
            if ! git merge-base --is-ancestor "$t" HEAD 2>/dev/null; then
              unmerged="$unmerged $t"
            fi
          done
          # Trim leading space, replace internal whitespace with comma so we
          # can pass it through to the next step as a stable token.
          unmerged_clean=$(echo "$unmerged" | xargs | tr ' ' ',')
          echo "tags=$unmerged_clean" >> "$GITHUB_OUTPUT"

      - name: Merge each unmerged tag
        if: steps.tags.outputs.tags != ''
        env:
          TAG_LIST: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          IFS=',' read -ra TAGS <<< "$TAG_LIST"
          for tag in "${TAGS[@]}"; do
            upstream_label="${tag#upstream-}"
            echo "::group::Merging $upstream_label"
            if git merge --no-ff -m "chore: sync upstream $upstream_label" "$tag"; then
              echo "Merged $upstream_label cleanly."
            else
              echo "::error::Conflict merging $upstream_label — opening PR for review."
              git merge --abort || true
              branch="sync/upstream-$upstream_label"
              git checkout -B "$branch"
              git merge --no-ff --no-commit "$tag" || true
              git -c core.editor=true commit -am "chore: sync upstream $upstream_label (CONFLICTS)" || true
              git push origin "$branch" --force
              gh pr create \
                --base data-club-patch \
                --head "$branch" \
                --title "sync: upstream $upstream_label (conflicts)" \
                --body "Automated merge of upstream tag \`$upstream_label\` produced conflicts. Resolve and merge manually." \
                || true
              git checkout data-club-patch
              # Stop on first conflict — let the human resolve before continuing.
              exit 0
            fi
            echo "::endgroup::"
          done

      - name: Push merged commits
        if: steps.tags.outputs.tags != ''
        run: git push origin data-club-patch
